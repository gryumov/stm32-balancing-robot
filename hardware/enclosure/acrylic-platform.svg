<svg xmlns="http://www.w3.org/2000/svg" width="1390" height="840" viewBox="80 140 1390 840" role="img" aria-labelledby="title desc">
<title id="title">Платформа балансирующего робота — размерный эскиз</title>
<desc id="desc">Восстановлено по старому эскизу. Размеры в миллиметрах. Диаметры отверстий на эскизе не указаны; восемь отверстий предназначены для крепления двигателей. Симметрия принята при восстановлении. Четыре внешних угла скруглены одинаковыми дугами; радиус показан условно и требует уточнения. Толщина и допуски требуют уточнения. Не для лазерной резки.</desc>
<defs><marker id="arrow" viewBox="-10 -3 10 6" refX="0" refY="0" markerWidth="12" markerHeight="7" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0 0 L-10 -3 L-10 3 Z" fill="#20252a"/></marker></defs>
